name = "pse-market-gateway"
main = "index.mjs"
compatibility_date = "2026-10-09"
workers_dev = true

[vars]
# Keep false until the operator has written permission for public display.
PUBLIC_DISPLAY_LICENSED = "false"
# Origin only; repository paths do not belong here. Add localhost only for development.
ALLOWED_ORIGINS = "https://YOUR_ACCOUNT.github.io"

# Store EODHD_TOKEN using `wrangler secret put EODHD_TOKEN`; never put it here.
# Optional approved-source KV namespace. Replace the ID before uncommenting.
# [[kv_namespaces]]
# binding = "MARKET_DATA"
# id = "YOUR_LICENSED_MARKET_DATA_NAMESPACE_ID"

# Optional Cloudflare rate-limiter binding (configure namespace_id for your account).
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "YOUR_RATE_LIMITER_NAMESPACE_ID"
# simple = { limit = 120, period = 60 }
